name: Debug Secrets

on:
  push:
    branches: [ "main" ]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets exist
        run: |
          echo "USERNAME length: ${#DOCKERHUB_USERNAME}"
          echo "TOKEN length: ${#DOCKERHUB_TOKEN}"
          if [ -z "$DOCKERHUB_USERNAME" ]; then echo "::error::DOCKERHUB_USERNAME secret missing"; fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then echo "::error::DOCKERHUB_TOKEN secret missing"; fi
      
      - name: Show login attempt
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "Will login as: $USERNAME"
          echo "Password length: ${#PASSWORD}"
